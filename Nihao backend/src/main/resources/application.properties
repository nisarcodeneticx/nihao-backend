# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8089
server.servlet.context-path=/api
# Avoid DevTools spawning a second JVM that competes for the same port (common on Windows/IntelliJ)
spring.devtools.restart.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/nihao_urdu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
# Use Flyway for schema changes; do not let Hibernate ALTER existing MySQL tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# FLYWAY MIGRATION
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================================
# JWT CONFIGURATION
# ============================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# LOGGING CONFIGURATION - ENABLED FOR DEVELOPMENT
# ============================================
# Root logging level
logging.level.root=INFO

# Application logs
logging.level.com.codeneticx=DEBUG
logging.level.com.codeneticx.nihaobackend=DEBUG

# Spring framework logs
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG

# Hibernate logs
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
logging.level.org.hibernate.cache=INFO
logging.level.org.hibernate.resource.transaction=INFO
logging.level.org.hibernate.tool.schema=ERROR

# Database connection pool
logging.level.com.zaxxer.hikari=DEBUG

# Controller and API logs
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.web.filter=DEBUG

# Mobile API logs
logging.level.com.codeneticx.nihaobackend.controller.V1Controller=DEBUG
logging.level.com.codeneticx.nihaobackend.controller.V1ApiController=DEBUG

# ============================================
# LOG FILE OUTPUT (Optional)
# ============================================
# Uncomment to write logs to a file
# logging.file.name=logs/nihao-backend.log
# logging.logback.rollingpolicy.max-history=30
# logging.logback.rollingpolicy.total-size-cap=100MB

# ============================================
# SWAGGER/OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=true
springdoc.packages-to-scan=com.codeneticx.nihaobackend.controller

# ============================================
# CORS CONFIGURATION
# ============================================
# CORS is handled in CorsConfig so admin.html works from file:// (Origin: null)
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=false
app.cors.max-age=3600

# ============================================
# ERROR HANDLING
# ============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.static-path-pattern=/static

# ============================================
# ACTUATOR (Monitoring)
# ============================================
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=always
management.endpoint.loggers.enabled=true

# ============================================
# MOBILE APP CONFIGURATION
# ============================================
mobile.api.version=1.0.0
mobile.session.timeout=86400
mobile.max-devices-per-user=5

# Google Sign-In: Web OAuth client ID (same value as GOOGLE_WEB_CLIENT_ID in the Android app)
app.google.client-id=${GOOGLE_WEB_CLIENT_ID:792346534135-obqbomsaq5f5nolhoq5ta9nd3fmdhh74.apps.googleusercontent.com}

# ============================================
# THREAD POOL CONFIGURATION
# ============================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25

# ============================================
# CACHE CONFIGURATION
# ============================================
spring.cache.type=simple
spring.cache.cache-names=courses,units,lessons,vocabulary