# Used only when SPRING_PROFILES_ACTIVE=vercel.
# The database lives in memory inside the app, so no external database credentials are required.
# Vercel discards this data when the server goes idle and starts again.
spring.datasource.url=jdbc:h2:mem:nihao;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
